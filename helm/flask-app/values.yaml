replicaCount: 1

image:
  # Overridden by the pipeline with the real Docker Hub repository and commit SHA tag
  repository: docker.io/YOUR_DOCKERHUB_USERNAME/flask-hello-world
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 5000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
